# Aparece nos logs. Ajuda a saber qual aplicação está falando quando você
# tiver várias rodando ao mesmo tempo.
spring.application.name=vagas

# A porta fica no padrão do Spring Boot, 8080: é a que os arquivos .http deste
# repositório chamam. Trocar aqui é trocar lá também.
spring.datasource.url=jdbc:h2:mem:vagas
spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:dados/empresas.sql
# create-drop: o banco é em memória e recomeça do zero a cada subida (escolha do grupo, justificar no README)
spring.jpa.hibernate.ddl-auto=create-drop
