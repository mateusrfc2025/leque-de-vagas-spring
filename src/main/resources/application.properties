spring.application.name=vagas

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3

# update: cria tabelas e colunas que faltam e nunca apaga dados (o banco do Supabase é de verdade)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:dados/empresas.sql,classpath:dados/vagas.sql,classpath:dados/pessoas.sql